<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Portofolio PLP</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A4A;--sky:#CFE8F7;--sky2:#EAF5FC;--amber:#F2A33A;--bg:#FFFFFF;--ink:#14243A;--mut:#5A6B80;--card:#F5FAFD;--line:#D6E4EF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1626;--ink:#E6EEF7;--mut:#9FB2C7;--card:#12243B;--line:#244262;--sky2:#0F2036;--sky:#1C3A5C}}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.15;margin:0 0 .5em}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
nav{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
nav b{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;margin-right:auto}
nav a{color:#CFE8F7;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px}
nav a.on,nav a:hover{background:#fff2;color:#fff}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px;min-height:70vh}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:48px 28px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,6vw,64px);max-width:12ch}.hero p{max-width:52ch;color:#CFE8F7}
.hero:after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:var(--amber);opacity:.9}
.hero:before{content:"";position:absolute;right:120px;top:-40px;width:140px;height:140px;border-radius:50%;background:#6FB6E3;opacity:.5}
.hero>*{position:relative;z-index:1}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--amber);color:#1a1200;text-decoration:none;margin:4px 6px 4px 0}
.btn.o{background:transparent;border:1.5px solid currentColor;color:inherit}.btn.s{padding:6px 12px;font-size:14px}.btn.d{background:#C0392B;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0}
.stat{background:var(--sky2);border-radius:14px;padding:14px}.stat b{font:800 32px 'Bricolage Grotesque',sans-serif;display:block}
h2.t{font-size:28px;margin-top:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.card img,.card video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sky)}
.card h3{font-size:18px;margin:0}.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--sky);color:var(--navy);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#fff}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.bar input,.bar select,.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.bar input[type=search]{flex:1;min-width:180px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer}.tabs .on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl{border-left:3px solid var(--amber);margin:16px 0 16px 10px;padding-left:20px}
.tl .w{position:relative;margin-bottom:22px}.tl .w:before{content:"";position:absolute;left:-29px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--navy);border:3px solid var(--amber)}
.tl button{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer;width:100%}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 28px 'Bricolage Grotesque';margin:16px auto 0;overflow:hidden}
.pc{text-align:center}.pc .b{align-items:center}
dialog{border:0;border-radius:16px;max-width:640px;width:calc(100% - 24px);padding:0;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#0008}dialog .in{padding:20px}dialog img,dialog video{width:100%;max-height:50vh;object-fit:contain;background:var(--sky);border-radius:10px}
.f label{display:block;font-weight:600;font-size:14px;margin-top:10px}.f input,.f select,.f textarea{width:100%}.err{color:#C0392B;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}.scroll{overflow-x:auto}
.q{border-left:4px solid var(--amber);padding:6px 14px;margin:8px 0;font-style:italic}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}
.empty{text-align:center;padding:40px;border:2px dashed var(--line);border-radius:14px;color:var(--mut)}
footer{background:var(--navy);color:#CFE8F7;padding:24px 16px;text-align:center;font-size:14px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<footer><b>Digital Portofolio PLP</b><br>Kelompok PLP Holistik SDQ Amirul Mukminin · Universitas Sultan Ageng Tirtayasa · Program Studi PGSD<br>Proyek mata kuliah Teknologi dan Transformasi Digital</footer>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Observasi Lingkungan Sekolah','Observasi Kegiatan Pembelajaran','Praktik Mengajar di Kelas','Kegiatan Ekstrakurikuler','Kegiatan Administrasi Sekolah','Kegiatan Keagamaan dan Pembiasaan','Penerapan Teknologi dalam Pembelajaran','Kegiatan Lainnya'];
const COL=['#0B2A4A','#1F6FA8','#F2A33A','#2E8B7A','#6B5CA5','#C0562F','#1B8FB5','#5A6B80'];
const PCATS=['Media pembelajaran digital','Presentasi interaktif','Video pembelajaran','LKPD digital','Poster dan infografis','Website atau aplikasi','Lainnya'];
const MCATS=['Konsep Dasar','Media Digital','Asesmen Digital','Etika dan Keamanan Digital'];
const ph=(t,c=0)=>{const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="${COL[c%8]}"/><circle cx="330" cy="60" r="70" fill="#fff" opacity=".12"/><text x="24" y="270" font-family="sans-serif" font-size="20" fill="#fff">${esc(t).slice(0,34)}</text><text x="24" y="150" font-size="72">${['🏫','👀','📚','⚽','🗂️','🕌','💻','📌'][c%8]}</text></svg>`;return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)};
const D=(id,title,type,date,week,cat,members,desc)=>({id,title,type,date,week,cat,members,desc});
const DEF={
acts:[D(1,'Pengenalan lingkungan dan sarana sekolah','foto','2026-08-10',1,0,'Anggota 1, Anggota 2','Berkeliling mengenal ruang kelas, perpustakaan, dan fasilitas sekolah bersama guru pamong.'),
D(2,'Observasi pembelajaran kelas rendah','foto','2026-08-12',1,1,'Anggota 3','Mengamati pola interaksi guru dan siswa kelas 2 pada pembelajaran tematik.'),
D(3,'Kegiatan literasi pagi','foto','2026-08-14',1,5,'Anggota 1, Anggota 4','Pendampingan literasi 15 menit sebelum jam pelajaran.'),
D(4,'Praktik mengajar Bahasa Indonesia','foto','2026-08-19',2,2,'Anggota 2','Mengajar teks narasi sederhana di kelas 3 dengan media gambar seri.'),
D(5,'Praktik mengajar Pendidikan Agama Islam','video','2026-08-21',2,2,'Anggota 4','Pembelajaran adab belajar dengan metode cerita dan diskusi.'),
D(6,'Pendampingan ekstrakurikuler pramuka','foto','2026-08-26',3,3,'Anggota 1, Anggota 3','Membantu pembina melatih baris-berbaris dan tali-temali.'),
D(7,'Membantu administrasi kelas','foto','2026-08-28',3,4,'Anggota 3','Menyusun daftar hadir, jurnal harian, dan arsip nilai kelas.'),
D(8,'Penggunaan media pembelajaran digital','video','2026-09-02',4,6,'Anggota 2, Anggota 4','Menayangkan kuis interaktif untuk penguatan materi kelas 5.'),
D(9,'Pembiasaan salat duha dan doa bersama','foto','2026-09-04',4,5,'Anggota 1','Mendampingi siswa dalam kegiatan pembiasaan keagamaan.'),
D(10,'Observasi pembelajaran kelas tinggi','foto','2026-09-09',5,1,'Anggota 3, Anggota 4','Mengamati diskusi kelompok IPAS di kelas 5.'),
D(11,'Peringatan hari besar sekolah','foto','2026-09-11',5,7,'Semua anggota','Ikut menyiapkan dan mendokumentasikan kegiatan sekolah.'),
D(12,'Evaluasi akhir dan perpisahan PLP','foto','2026-09-18',6,7,'Semua anggota','Refleksi bersama guru pamong dan penyerahan cenderamata.')],
materi:[{id:1,no:1,title:'Pengantar Transformasi Digital dalam Pendidikan',cat:0,sum:'Konsep dasar, tren, dan tantangan digitalisasi pendidikan.',fmt:'PDF',ref:'Placeholder: sesuaikan dengan RPS'},
{id:2,no:2,title:'Pengembangan Media Pembelajaran Digital',cat:1,sum:'Prinsip desain media, aplikasi pendukung, dan contoh praktik.',fmt:'PPT',ref:'Placeholder'},
{id:3,no:3,title:'Asesmen Digital dan Analitik Belajar',cat:2,sum:'Kuis daring, rubrik digital, dan pemanfaatan data hasil belajar.',fmt:'PDF',ref:'Placeholder'},
{id:4,no:4,title:'Etika dan Keamanan Digital bagi Guru',cat:3,sum:'Jejak digital, hak cipta, dan perlindungan data siswa.',fmt:'PPT',ref:'Placeholder'}],
produk:[{id:1,name:'Kuis Interaktif Pecahan',cat:1,maker:'Anggota 2',desc:'Kuis berbasis slide untuk penguatan konsep pecahan kelas 4.',tech:'Canva, Wordwall',url:''},
{id:2,name:'Video Pembelajaran Siklus Air',cat:2,maker:'Anggota 3',desc:'Video animasi singkat tentang daur air untuk kelas 5.',tech:'CapCut',url:''},
{id:3,name:'LKPD Digital Teks Narasi',cat:3,maker:'Anggota 4',desc:'LKPD interaktif dengan tugas menyusun cerita bergambar.',tech:'Liveworksheets',url:'https://www.liveworksheets.com'},
{id:4,name:'Infografis Pembiasaan 5S',cat:4,maker:'Anggota 1',desc:'Poster Senyum, Salam, Sapa, Sopan, Santun untuk dinding kelas.',tech:'Canva',url:''}],
anggota:[1,2,3,4].map(i=>({id:i,name:'[Nama Anggota '+i+']',nim:'[NIM]',role:['Ketua','Sekretaris','Bendahara','Dokumentator'][i-1],bio:'Deskripsi singkat anggota.'}))};
const ND=['2026-08-20','2026-08-25','2026-08-27','2026-09-16','2026-09-18','2026-09-03','2026-09-01','2026-09-08','2026-09-10','2026-08-26','2026-10-20','2026-11-26'];
DEF.acts.forEach((a,i)=>{a.date=ND[i];a.week=Math.floor((new Date(a.date)-new Date('2026-08-17'))/6048e5)+1;a.by='Admin'});DEF.acts[5].type='video';
DEF.materi=[{id:1,title:'Pengantar Teknologi dan Transformasi Digital',body:'Ringkasan umum tentang mata kuliah Teknologi dan Transformasi Digital.\nIsi materi ini akan dimasukkan oleh admin melalui Dashboard.'},{id:2,title:'Penerapan Teknologi dalam Pendidikan',body:'Bagian ini disiapkan untuk uraian materi yang akan diisi admin.'}];
DEF.log=[];
let S;try{S=JSON.parse(localStorage.getItem('plp3'))}catch(e){}if(!S)S=JSON.parse(JSON.stringify(DEF));
const save=()=>{try{localStorage.setItem('plp3',JSON.stringify(S))}catch(e){toast('Penyimpanan penuh: gunakan file lebih kecil',1)}};
let admin=false,st={q:'',cat:'',week:'',date:'',n:6,tab:'timeline',at:'acts'};
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'#C0392B':'';t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function dl(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Mengunduh '+name)}
const dlText=(txt,name)=>dl(URL.createObjectURL(new Blob([txt],{type:'text/plain'})),name);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40);
const img=a=>a.file&&a.type==='foto'?a.file:ph(a.title,a.cat);
const media=a=>a.type==='video'&&a.file?`<video src="${a.file}" controls></video>`:`<img src="${img(a)}" alt="${esc(a.title)}">`;
function actCard(a){return `<article class="card"><div style="position:relative">${`<img src="${img(a)}" alt="${esc(a.title)}" loading="lazy">`}${a.type==='video'?'<span style="position:absolute;inset:0;display:grid;place-items:center;font-size:48px;color:#fff;text-shadow:0 2px 8px #000">▶</span>':''}</div><div class="b"><span class="tag">${CATS[a.cat]}</span><h3>${esc(a.title)}</h3><span class="mut">${a.date} · Minggu ${a.week}<br>${esc(a.members)}</span><div class="row"><button class="btn s" data-a="det" data-id="${a.id}">${a.type==='video'?'Putar':'Detail'}</button><button class="btn s o" data-a="dla" data-id="${a.id}">Unduh</button></div></div></article>`}
function filtered(){const q=st.q.toLowerCase();return S.acts.filter(a=>(!q||(a.title+a.members).toLowerCase().includes(q))&&(st.cat===''||a.cat==st.cat)&&(!st.week||a.week==st.week)&&(!st.date||a.date===st.date)).sort((x,y)=>y.date.localeCompare(x.date))}
const empty=m=>`<div class="empty">${m}</div>`;
function timeline(){const ws=[...new Set(S.acts.map(a=>a.week))].sort((a,b)=>a-b);return `<div class="tl">${ws.map(w=>`<div class="w"><h3>Minggu ${w}</h3>${S.acts.filter(a=>a.week==w).sort((a,b)=>a.date.localeCompare(b.date)).map(a=>`<button data-a="det" data-id="${a.id}"><b>${esc(a.title)}</b><br><span class="mut">${a.date} — ${esc(a.desc)}</span></button>`).join('')}</div>`).join('')}</div>`}
const P={
home(){const n=S.acts;return `<section class="hero"><h1>Digital Portofolio PLP</h1><p>Pusat dokumentasi dan portofolio kegiatan Pengenalan Lingkungan Persekolahan mahasiswa PGSD: arsipkan, cari, dan unduh semua jejak kegiatan di satu tempat.</p><a class="btn" href="#kegiatan">Jelajahi Kegiatan</a><a class="btn o" href="#unduhan">Lihat Dokumentasi</a></section>
<div class="stats"><div class="stat"><b>${n.length}</b>Kegiatan</div><div class="stat"><b>${n.filter(a=>a.type==='foto').length}</b>Foto</div><div class="stat"><b>${n.filter(a=>a.type==='video').length}</b>Video</div><div class="stat"><b>${S.produk.length}</b>Produk digital</div></div>
<h2 class="t">Dokumentasi terbaru</h2><div class="grid">${[...n].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(actCard).join('')}</div>
<h2 class="t">Perjalanan PLP</h2>${timeline()}
<h2 class="t">Produk digital</h2><div class="grid">${S.produk.slice(0,3).map(prodCard).join('')}</div>`},
profil(){return `<h1>Profil Kelompok</h1><div class="card"><div class="b"><h3>Kelompok PLP Holistik SDQ Amirul Mukminin</h3><p>Universitas Sultan Ageng Tirtayasa · Program Studi PGSD<br>Sekolah: SDQ Amirul Mukminin · Periode: Agustus–November 2026<br>Dosen Pembimbing Lapangan: Dr. Ana Nurhasanah, S.Pd., M.Pd. · Guru Pamong: [Nama Guru Pamong]</p><p><b>Visi:</b> Menjadi calon guru SD yang profesional, adaptif, dan melek teknologi.<br><b>Tujuan:</b> Mengenal lingkungan sekolah, berlatih mengajar, dan menerapkan teknologi digital dalam pembelajaran serta dokumentasi.</p></div></div><h2 class="t">Anggota</h2><div class="grid">${S.anggota.map(m=>`<div class="card pc"><div class="avatar">${m.file?`<img src="${m.file}" alt="" style="width:100%;height:100%;aspect-ratio:1">`:esc(m.name.replace(/[^A-Za-z0-9 ]/g,'').split(' ').map(x=>x[0]).join('').slice(0,2)||'?')}</div><div class="b"><h3>${esc(m.name)}</h3><span class="mut">NIM ${esc(m.nim)}</span><span class="tag">${esc(m.role)}</span><p class="mut">${esc(m.bio)}</p></div></div>`).join('')}</div>`},
kegiatan(){const l=filtered(),weeks=[...new Set(S.acts.map(a=>a.week))].sort((a,b)=>a-b);
return `<h1>Kegiatan PLP</h1><div class="tabs">${[['timeline','Timeline Kegiatan'],['galeri','Foto'],['vbm','Video Kegiatan Belajar Mengajar'],['vlain','Video Selain Kegiatan Belajar Mengajar']].map(([k,v])=>`<button class="${st.tab===k?'on':''}" data-a="tab" data-id="${k}">${v}</button>`).join('')}</div>`+(st.tab==='timeline'?timeline():`<div class="bar"><input type="search" id="q" placeholder="Cari kegiatan atau anggota…" value="${esc(st.q)}" aria-label="Cari"><select id="fc" aria-label="Kategori"><option value="">Semua kategori</option>${CATS.map((c,i)=>`<option value="${i}" ${st.cat==i&&st.cat!==''?'selected':''}>${c}</option>`).join('')}</select><select id="fw" aria-label="Minggu"><option value="">Semua minggu</option>${weeks.map(w=>`<option ${st.week==w?'selected':''} value="${w}">Minggu ${w}</option>`).join('')}</select><input type="date" id="fd" value="${st.date}" aria-label="Tanggal"><button class="btn s o" data-a="reset">Reset</button></div>`+(()=>{const KB=[1,2,6],v=l.filter(a=>st.tab==='galeri'?a.type==='foto':a.type==='video'&&(KB.includes(+a.cat)===(st.tab==='vbm')));return v.length?`<div class="grid">${v.slice(0,st.n).map(actCard).join('')}</div>${v.length>st.n?'<p style="text-align:center"><button class="btn" data-a="more">Muat lebih banyak</button></p>':''}`:empty('Belum ada dokumentasi yang cocok. Ubah filter atau unggah lewat Dashboard.')})())},
materi(){return `<h1>Materi Teknologi dan Transformasi Digital</h1><p class="mut">Arsip materi perkuliahan tentang penerapan teknologi dalam pendidikan. Ubah daftar ini sesuai RPS di Dashboard.</p><div class="grid">${S.materi.sort((a,b)=>a.no-b.no).map(m=>`<article class="card"><div class="b"><span class="tag">Pertemuan ${m.no} · ${MCATS[m.cat]}</span><h3>${esc(m.title)}</h3><p>${esc(m.sum)}</p><span class="mut">Format ${m.fmt} · Referensi: ${esc(m.ref)}</span><div class="row"><button class="btn s" data-a="vm" data-id="${m.id}">Lihat materi</button><button class="btn s o" data-a="dm" data-id="${m.id}">Unduh</button></div></div></article>`).join('')||empty('Belum ada materi.')}</div>`},
produk(){return `<h1>Produk Digital</h1><div class="tabs"><button class="${st.pc===undefined?'on':''}" data-a="pc" data-id="">Semua</button>${PCATS.map((c,i)=>`<button class="${st.pc===i?'on':''}" data-a="pc" data-id="${i}">${c}</button>`).join('')}</div><div class="grid">${S.produk.filter(p=>st.pc===undefined||p.cat===st.pc).map(prodCard).join('')||empty('Belum ada produk pada kategori ini.')}</div>`},
refleksi(){const R=[['Refleksi Individu',['Observasi memperlihatkan bahwa pengelolaan kelas yang konsisten membuat siswa lebih tenang.','Praktik mengajar melatih keberanian dan kemampuan memberi instruksi yang jelas.','Tantangan: mengatur waktu dan menjaga perhatian siswa. Perlu diperbaiki: ragam pertanyaan pemantik.']],['Refleksi Kelompok',['Pembagian tugas berdasarkan peran memudahkan penyusunan dokumentasi.','Kendala jadwal diatasi dengan rapat singkat dan papan tugas bersama.']],['Dampak Teknologi Digital',['Media digital membuat siswa lebih antusias pada materi.','Repositori bersama merapikan dokumentasi sehingga penyusunan laporan lebih cepat.']]];
return `<h1>Refleksi</h1><p class="mut">Contoh isi: ganti dengan refleksi asli setiap anggota.</p>${R.map(([h,qs])=>`<h2 class="t">${h}</h2>${qs.map(q=>`<div class="q">${q}</div>`).join('')}`).join('')}`},
